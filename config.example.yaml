# Маршруты: каждый пост любого канала из from уходит во все каналы из to.
# В to — каналы MAX и сообщества VK вперемешку: https://vk.com/name или vk:name.
# Канал — ссылка, @имя или числовой id (для закрытых каналов). В from и to
# можно указать один канал или список. Токены сюда не пишутся — они в .env.
routes:
  # Один канал в один
  - from: https://t.me/my_channel
    to: https://max.ru/my_channel

  # Несколько каналов в несколько
  - from:
      - https://t.me/my_news
      - "-1001234567890"
    to:
      - https://max.ru/my_news
      - https://max.ru/my_digest
      - https://vk.com/my_community
