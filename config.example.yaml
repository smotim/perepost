# Каждый пост любого канала из from уходит во все каналы из to.
# Для нескольких каналов используйте channels: [...] вместо channel.
# Токены и параметры вебхука MAX задаются в .env.
routes:
  - name: telegram-to-max
    from: { platform: telegram, channel: "@my_channel" }
    to: { platform: max, channel: "-70123456789" }
    sync_edits: true

  # Требует вебхука MAX и права публикации в Telegram.
  - name: max-to-telegram
    from: { platform: max, channel: "-70123456789" }
    to: { platform: telegram, channel: "@my_channel" }
    sync_edits: true
    # sync_deletes: true
